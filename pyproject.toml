[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-plt"
version = "0.24.6"
description = "SciTeX plotting module (alias for figrecipe)"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" },
]
keywords = [
    "scitex",
    "matplotlib",
    "figrecipe",
    "plotting",
    "visualization",
    "scientific",
    "publication",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pandas",
    "figrecipe>=0.24.0",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "scitex-dev>=0.11.7",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-plt[dev,docs]",
]

[project.scripts]
scitex-plt = "figrecipe._cli:main"

[project.entry-points."scitex_dev.docs"]
scitex-plt = "scitex_plt"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-plt"
Documentation = "https://scitex-plt.readthedocs.io"
Repository = "https://github.com/ywatanabe1989/scitex-plt.git"
Issues = "https://github.com/ywatanabe1989/figrecipe/issues"

[project.entry-points."scitex_dev.skills"]
scitex-plt = "scitex_plt"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_plt"]

[tool.coverage.run]
parallel = true
source = ["scitex_plt"]
concurrency = ["multiprocessing", "thread"]

[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]
